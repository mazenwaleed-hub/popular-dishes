<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popular Dishes</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <i class="fa-solid fa-kitchen-set"></i>
          <h2>ONYX Food</h2>
        </div>
        <div class="pages-bts">
          <button class="active"><i class="fa-solid fa-house"></i> Home</button>
          <button><i class="fa-solid fa-bread-slice"></i>Dishes</button>
          <button><i class="fa-solid fa-user"></i>About</button>
        </div>
        <h2><i class="fa-solid fa-bars"></i></h2>
      </nav>
    </header>
    <section id="dishes">
      <div class="text">
        <div class="smallHeading">
          <div class="line"></div>
          <h5>OUR SPECIALTIES</h5>
          <div class="line"></div>
        </div>
        <div class="bigHeading">
          <h1>Popular <span>Dishes</span></h1>
          <p>
            Handpicked form our menu, these dishes are loved by our guests
            <br />
            and crafted with the freshest ingredients
          </p>
        </div>
      </div>
      <div class="dishes"></div>
      <div class="btns">
        <button id="prev"><i class="fa-solid fa-chevron-left"></i></button>

        <div class="dots">
          <!-- <div class="dot"></div> -->
        </div>
        <button id="next"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </section>
    <script src="main.js"></script>
  </body>
</html>
